name: Validate Skill
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python scripts/validate_repo.py .
